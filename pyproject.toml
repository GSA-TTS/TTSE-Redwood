# Build backend
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# Project metadata
[project]
name = "redwood-dataagent"
version = "0.1.0"
description = "TTSE Redwood Data Agent MVP foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.7.0",
  "jsonschema>=4.23.0",
  "paramiko>=3.4.0",
  "boto3>=1.34.0",
  "ibis-framework[postgres]>=12.0.0",
  "psycopg-binary>=3.3.4",
  "packaging>=24.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

# Optional dependencies
[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

# Setuptools src layout
[tool.setuptools]
package-dir = {"" = "src"}

# Package discovery
[tool.setuptools.packages.find]
where = ["src"]

# Pytest defaults
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/redwood_dataagent --cov-report=xml:coverage/coverage.xml --cov-report=term-missing"

# Coverage source paths are relative to the working directory so they survive
# docker cp and remain resolvable by SonarQube in the Jenkins workspace.
[tool.coverage.run]
relative_files = true

# Ruff linter configuration
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort (import sorting)
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
]
ignore = [
  "E501",  # line-too-long (handled by formatter)
  "W191",  # indentation-contains-tabs
]

[tool.ruff.lint.isort]
known-first-party = ["redwood_dataagent"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841"]  # Unused variable in tests is often intentional
