# Build backend
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# Project metadata
[project]
name = "redwood-dataagent"
version = "0.1.0"
description = "TTSE Redwood Data Agent MVP foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.7.0",
]

# Optional dependencies
[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

# Setuptools src layout
[tool.setuptools]
package-dir = {"" = "src"}

# Package discovery
[tool.setuptools.packages.find]
where = ["src"]

# Pytest defaults
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/redwood_dataagent --cov-report=xml:coverage/coverage.xml --cov-report=term-missing"

# Coverage source paths are relative to the working directory so they survive
# docker cp and remain resolvable by SonarQube in the Jenkins workspace.
[tool.coverage.run]
relative_files = true