sonar.projectKey=ttse-redwood
sonar.projectName=ttse-redwood
sonar.projectVersion=1.0

sonar.sources=src/redwood_dataagent
sonar.tests=tests

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/coverage/**

# Coverage report generated by pytest-cov during the Docker build (test stage),
# extracted from the built image by the Jenkins pipeline before static_code_analysis().
sonar.python.coverage.reportPaths=coverage/coverage.xml

# Required by sonar-scanner even for non-Java projects; pipeline creates this dir via 'mkdir -p empty'
sonar.java.binaries=empty

sonar.sourceEncoding=UTF-8
